name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate version input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Validate version format and progression
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          CURRENT_BRANCH="${{ github.ref_name }}"

          if [ "$CURRENT_BRANCH" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Releases must be dispatched from '$DEFAULT_BRANCH' (current: '$CURRENT_BRANCH')."
            exit 1
          fi

          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' does not match required format vX.Y.Z (for example: v0.1.0)."
            exit 1
          fi

          if git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}.git" "refs/tags/${VERSION}" > /dev/null 2>&1; then
            echo "::error::Tag '$VERSION' already exists."
            exit 1
          fi

          LATEST=$(
            gh api "repos/${{ github.repository }}/releases?per_page=100" \
              --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))][0].tag_name // ""'
          )

          if [ -n "$LATEST" ]; then
            NEW="${VERSION#v}"
            OLD="${LATEST#v}"
            IFS='.' read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$NEW"
            IFS='.' read -r OLD_MAJOR OLD_MINOR OLD_PATCH <<< "$OLD"

            if [ "$NEW_MAJOR" -lt "$OLD_MAJOR" ] || \
               ([ "$NEW_MAJOR" -eq "$OLD_MAJOR" ] && [ "$NEW_MINOR" -lt "$OLD_MINOR" ]) || \
               ([ "$NEW_MAJOR" -eq "$OLD_MAJOR" ] && [ "$NEW_MINOR" -eq "$OLD_MINOR" ] && [ "$NEW_PATCH" -le "$OLD_PATCH" ]); then
              echo "::error::New version '$VERSION' must be greater than latest stable release '$LATEST'."
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  create-pre-release:
    name: Create pre-release
    runs-on: ubuntu-latest
    needs: [validate-version]
    steps:
      - uses: actions/checkout@v6
      - name: Create pre-release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          gh release create "$VERSION" \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --generate-notes \
            --prerelease \
            --repo "${{ github.repository }}"

  precompile-extension:
    name: Precompile extension
    runs-on: ubuntu-latest
    needs: [validate-version, create-pre-release]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-version.outputs.version }}
      - uses: cli/gh-extension-precompile@v2
        with:
          generate_attestations: true
          go_version_file: go.mod
          release_tag: ${{ needs.validate-version.outputs.version }}

  promote-release:
    name: Promote release to latest
    runs-on: ubuntu-latest
    needs: [validate-version, precompile-extension]
    steps:
      - name: Verify release and promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"

          IS_PRERELEASE=$(gh api "repos/${{ github.repository }}/releases/tags/${VERSION}" --jq '.prerelease')
          if [ "$IS_PRERELEASE" != "true" ]; then
            echo "::error::Release '$VERSION' is not a prerelease and cannot be promoted by this workflow."
            exit 1
          fi

          LATEST=$(
            gh api "repos/${{ github.repository }}/releases?per_page=100" \
              --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))][0].tag_name // ""'
          )

          if [ -n "$LATEST" ]; then
            NEW="${VERSION#v}"
            OLD="${LATEST#v}"
            IFS='.' read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$NEW"
            IFS='.' read -r OLD_MAJOR OLD_MINOR OLD_PATCH <<< "$OLD"

            if [ "$NEW_MAJOR" -lt "$OLD_MAJOR" ] || \
               ([ "$NEW_MAJOR" -eq "$OLD_MAJOR" ] && [ "$NEW_MINOR" -lt "$OLD_MINOR" ]) || \
               ([ "$NEW_MAJOR" -eq "$OLD_MAJOR" ] && [ "$NEW_MINOR" -eq "$OLD_MINOR" ] && [ "$NEW_PATCH" -le "$OLD_PATCH" ]); then
              echo "::error::New version '$VERSION' must still be greater than latest stable release '$LATEST' at promotion time."
              exit 1
            fi
          fi

          gh release edit "$VERSION" --prerelease=false --latest --repo "${{ github.repository }}"
