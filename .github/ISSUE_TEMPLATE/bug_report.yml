name: Bug report
description: Report a reproducible problem with gh-template
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include real tokens, secrets, private repository names, or other sensitive data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized output or errors.
      render: text
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Manifest snippet
      description: If relevant, include the smallest sanitized template-metadata.yml snippet that reproduces the issue.
      render: yaml
    validations:
      required: false
  - type: input
    id: gh-version
    attributes:
      label: GitHub CLI version
      placeholder: gh version
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: gh-template version or commit
      placeholder: gh extension list | grep template
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04, etc.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have removed or replaced secrets and sensitive repository details.
          required: true
        - label: I have searched existing issues and discussions.
          required: true
