settings:
    has_wiki: false
    has_issues: true
    has_projects: false
    allow_squash_merge: true
    allow_merge_commit: true
    allow_rebase_merge: true
    allow_auto_merge: false
    delete_branch_on_merge: false
    allow_update_branch: false
    visibility: private
    description: AVM-aligned Terraform module template for Power Platform modules (res-*, ptn-*, utl-*) with workflows, documentation and agentic AI tooling.
topics:
    - module
    - power-platform
    - template
    - terraform
    - avm-aligned
environments:
    - name: copilot
      wait_timer: 0
      prevent_self_review: false
      reviewers:
          - rpothin
      deployment_branch_policy: custom
      deployment_branch_patterns:
          - main
          - "release/*"
      variables:
          - name: DEPLOY_ENV
            value: production
      secrets:
          - name: API_KEY
            value: "PLACEHOLDER"
